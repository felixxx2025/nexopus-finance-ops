apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexopus-web
  labels:
    app: nexopus-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexopus-web
  template:
    metadata:
      labels:
        app: nexopus-web
    spec:
      containers:
      - name: web
        image: nexopus-web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://nexopus-api:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nexopus-web
spec:
  selector:
    app: nexopus-web
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
