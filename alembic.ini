# Alembic — Nexopus Finance Ops
# Documentação: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Caminho para os scripts de migração
script_location = alembic

# Template de nome de arquivo para novas revisões
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone para timestamps nos scripts gerados
timezone = America/Sao_Paulo

# DATABASE_URL será lida via variável de ambiente em alembic/env.py
# sqlalchemy.url =

[post_write_hooks]
# Formata automaticamente novos arquivos de migração com ruff
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
